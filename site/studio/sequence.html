<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animation preview</title><style>body{margin:0;height:100dvh;background:#091a25;display:grid;place-items:center;color:#b8d4df;font:13px system-ui}img{width:80%;height:75dvh;object-fit:contain;image-rendering:auto}footer{position:fixed;bottom:24px;display:flex;gap:20px;align-items:center}button{background:#17332e;border:1px solid #55796c;color:#c8eddc;padding:9px 20px;border-radius:7px}</style></head><body><img id="frame" alt="Animation frame"><footer><button id="play">Play animation</button><span id="info"></span></footer><script type="module">
import {api} from '/studio/api-client.mjs';
const id=new URLSearchParams(location.search).get('asset'),asset=await api('/api/assets/'+encodeURIComponent(id)),folder=asset.relative.slice(0,asset.relative.lastIndexOf('/')+1);const assets=await api('/api/assets?project='+encodeURIComponent(asset.projectId)),frames=assets.filter(a=>a.sourceId===asset.sourceId&&a.batchId===asset.batchId&&a.relative?.slice(0,a.relative.lastIndexOf('/')+1)===folder&&/frame[_-]?\d+\.(png|webp|jpg)$/i.test(a.filename)).sort((a,b)=>a.filename.localeCompare(b.filename,undefined,{numeric:true}));let i=0,timer;const image=document.querySelector('#frame'),button=document.querySelector('#play');image.src=asset.url;document.querySelector('#info').textContent=frames.length+' frames';button.onclick=()=>{if(timer){clearInterval(timer);timer=null;button.textContent='Play animation';}else{button.textContent='Pause animation';timer=setInterval(()=>{image.src=frames[i++%frames.length].url;},100);}};addEventListener('pagehide',()=>clearInterval(timer));
</script></body></html>
